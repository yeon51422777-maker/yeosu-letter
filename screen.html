<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>예수님께 편지 - 교회 스크린</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;overflow:hidden;background:#fff;font-family:"Noto Sans KR",sans-serif;}

#bg{position:fixed;inset:0;z-index:0;}
#jesus-img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}

#logo-wrap{position:fixed;top:18px;left:18px;z-index:110;cursor:pointer;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 2px 10px rgba(0,40,80,0.22);transition:background .2s,transform .2s;}
#logo-wrap:hover{background:rgba(255,255,255,0.85);transform:scale(1.06);}
#logo-img{width:130px;display:block;}

#title-bar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;text-align:center;pointer-events:none;}
#title-bar h1{font-size:clamp(16px,2vw,28px);font-weight:900;color:#C0392B;letter-spacing:3px;}
#title-bar p{font-size:13px;color:#888;margin-top:3px;letter-spacing:1.5px;}

/* 어드민 로그인 모달 */
#admin-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;}
#admin-modal-bg.show{display:flex;}
#admin-modal{background:#fff;border-radius:20px;padding:32px 28px;width:300px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.2);}
#admin-modal h3{font-size:17px;font-weight:700;color:#1a3a6e;margin-bottom:6px;}
#admin-modal p{font-size:12px;color:#aaa;margin-bottom:20px;}
#admin-pw{width:100%;padding:11px 14px;border:1.5px solid #dde;border-radius:10px;font-size:20px;text-align:center;letter-spacing:6px;outline:none;font-family:"Noto Sans KR",sans-serif;margin-bottom:8px;}
#admin-pw:focus{border-color:#4e7cf6;}
#admin-pw.error{border-color:#ef4444;animation:shake .3s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
#admin-pw-msg{font-size:12px;color:#ef4444;height:16px;margin-bottom:14px;}
#admin-btn-wrap{display:flex;gap:8px;}
#admin-cancel{flex:1;padding:11px;border-radius:10px;border:1.5px solid #dde;background:#fff;font-size:14px;cursor:pointer;font-family:"Noto Sans KR",sans-serif;}
#admin-confirm{flex:1;padding:11px;border-radius:10px;border:none;background:#1a3a6e;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:"Noto Sans KR",sans-serif;}

/* QR */
#qr-wrap{position:fixed;top:20px;right:20px;z-index:40;text-align:center;background:#fff;padding:11px;border-radius:14px;box-shadow:0 3px 14px rgba(0,30,70,0.25);}
#qr-code canvas,#qr-code img{width:130px;height:130px;display:block;}
#qr-label{display:none;}

/* 편지 스크롤 패널 */
#scroll-panel{
  position:fixed;left:10px;top:100px;bottom:20px;
  width:210px;z-index:100;
  overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
}
#scroll-inner{
  display:flex;flex-direction:column;gap:7px;
  position:absolute;bottom:0;width:100%;
  transition:none;
}
.mini-letter{
  background:rgba(238,248,255,0.95);
  border:1px solid #9FCBE8;
  border-radius:9px;
  padding:9px 11px;
  width:200px;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(20,60,110,0.12);
  opacity:0;
  transform:translateY(20px);
  transition:opacity 0.5s ease, transform 0.5s ease;
}
.mini-letter.show{opacity:1;transform:translateY(0);}
.mini-from{font-size:13px;color:#3a6ea5;margin-bottom:4px;font-family:"Noto Sans KR",sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-emoji{font-size:16px;margin-bottom:3px;letter-spacing:1px;}
.mini-text{font-size:13px;color:rgba(0,0,0,0.78);font-family:"Noto Sans KR",sans-serif;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* 대기 */
#waiting-msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;color:#bbb;font-size:14px;letter-spacing:2px;animation:pulse 2.5s ease-in-out infinite;pointer-events:none;}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* 연결점 */
#dot{position:fixed;bottom:20px;right:20px;z-index:100;width:8px;height:8px;border-radius:50%;background:#ccc;}
#dot.on{background:#4ade80;box-shadow:0 0 6px #4ade80;}

/* ── 편지 카드 ── */
.lcard{
  position:fixed;
  z-index:50;
  width:300px;
  pointer-events:none;
}

/* 봉투 래퍼 */
.lcard-env{
  width:300px;
  position:relative;
  transition:opacity 0.4s;
}

/* 편지지 */
.lcard-paper{
  position:absolute;
  top:0; left:0;
  width:300px;
  min-height:205px;
  background:#F3FBFE;
  border-radius:13px;
  padding:19px;
  box-shadow:0 8px 32px rgba(10,40,80,0.22);
  border:1.5px solid #8FC4E6;
  opacity:0;
  transform:scale(0.5) translateY(40px);
  transition:opacity 0.45s ease, transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
  z-index:10;
}
.lcard-paper.show{
  opacity:1;
  transform:scale(1) translateY(0);
}

/* 사진 있을 때 편지지 레이아웃 */
.lcard-paper.has-photo{
  width:300px;
  display:flex;
  gap:11px;
  align-items:stretch;
  min-height:205px;
}
.lp-content{flex:1;min-width:0;}
.lp-photo{width:112px;flex-shrink:0;display:flex;}
.lp-photo img{width:100%;border-radius:8px;display:block;object-fit:cover;height:100%;}

.lp-from{font-size:14px;color:#3a6ea5;font-weight:700;margin-bottom:9px;}
.lp-emojis{font-size:24px;margin-bottom:10px;letter-spacing:2px;}
.lp-text{font-size:18px;color:rgba(0,0,0,0.82);font-family:"Noto Sans KR",sans-serif;font-weight:400;line-height:1.65;word-break:keep-all;white-space:pre-wrap;}
.lp-lines{position:absolute;inset:0;border-radius:12px;overflow:hidden;pointer-events:none;z-index:-1;}
.lp-lines::before{content:"";position:absolute;inset:74px 0 0 0;background:repeating-linear-gradient(transparent,transparent 31px,rgba(95,166,212,0.18) 31px,rgba(95,166,212,0.18) 32px);}

/* 날개 */
.wing-l,.wing-r{position:absolute;top:20px;width:72px;height:62px;transform-style:preserve-3d;}
.wing-l{left:-50px;transform-origin:right center;}
.wing-r{right:-50px;transform-origin:left center;}
@keyframes flapL{0%{transform:rotateY(0) rotateZ(-10deg);}50%{transform:rotateY(-55deg) rotateZ(-24deg);}100%{transform:rotateY(0) rotateZ(-10deg);}}
@keyframes flapR{0%{transform:rotateY(0) rotateZ(10deg);} 50%{transform:rotateY(55deg) rotateZ(24deg);} 100%{transform:rotateY(0) rotateZ(10deg);}}
.wing-l.fl{animation:flapL 0.52s ease-in-out infinite;}
.wing-r.fl{animation:flapR 0.52s ease-in-out infinite;}

/* 파티클 */
.spark-wrap{position:absolute;inset:-50px;pointer-events:none;z-index:60;}
.sp{position:absolute;width:5px;height:5px;border-radius:50%;opacity:0;animation:spa 0.8s ease-out forwards;}
@keyframes spa{0%{transform:scale(0);opacity:1;}60%{opacity:1;}100%{transform:scale(1.4) translate(var(--tx),var(--ty));opacity:0;}}
.ss{position:absolute;font-size:13px;opacity:0;animation:ssa 1s ease-out forwards;}
@keyframes ssa{0%{transform:translate(0,0) scale(0) rotate(0);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(1) rotate(180deg);opacity:0;}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div id="bg"><img id="jesus-img" src="ship-bg.jpeg" alt="믿음의 항해"></div>
<div id="logo-wrap" onclick="adminLogin()" title="관리자 로그인">⚓</div>
<div id="title-bar" style="display:none;">
  <h1>✉️ 예수님께 편지를 보내요</h1>
  <p>QR 코드로 접속해서 마음을 전해보세요</p>
</div>
<div id="qr-wrap">
  <div id="qr-code"></div>
  <div id="qr-label">📱 QR 스캔하고<br>편지 보내기</div>
</div>
<div id="scroll-panel">
  <div id="scroll-inner"></div>
</div>
<div id="waiting-msg">🕊️ 편지를 기다리고 있어요...</div>

<!-- 어드민 로그인 모달 -->
<div id="admin-modal-bg">
  <div id="admin-modal">
    <h3>🔐 관리자 로그인</h3>
    <p>비밀번호를 입력해주세요</p>
    <input type="password" id="admin-pw" maxlength="10" placeholder="••••"
      onkeydown="if(event.key==='Enter')checkPw()" oninput="clearPwErr()">
    <div id="admin-pw-msg"></div>
    <div id="admin-btn-wrap">
      <button id="admin-cancel" onclick="closeAdminModal()">취소</button>
      <button id="admin-confirm" onclick="checkPw()">확인</button>
    </div>
  </div>
</div>
<div id="dot"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onChildAdded, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyAF8NZt4sy8S17jWdoZe06TTOOiF3gwccU",
  authDomain:"church-letters.firebaseapp.com",
  databaseURL:"https://church-letters-default-rtdb.firebaseio.com",
  projectId:"church-letters",
  storageBucket:"church-letters.firebasestorage.app",
  messagingSenderId:"969302363841",
  appId:"1:969302363841:web:f792105dad4e45b2cb8e40"
});
const db = getDatabase(app);

// ── QR 자동 생성 (라이브 주소 → 참가자 편지쓰기 페이지, 주소 항상 정확) ──
(function(){
  var joinUrl = location.origin + location.pathname.replace(/screen\.html$/, "");
  var box = document.getElementById("qr-code");
  try{
    if(!window.QRCode) throw new Error("no qr lib");
    new QRCode(box, { text: joinUrl, width: 250, height: 250, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    box.innerHTML = '<div style="width:250px;padding:16px;background:#fff;border-radius:10px;font-size:13px;word-break:break-all;color:#1a3a6e;text-align:center;line-height:1.5;">' + joinUrl + '</div>';
  }
})();

// ── 편지 스크롤 패널 (무한 루프) ──
const scrollInner = document.getElementById("scroll-inner");
let todayLetters = [];
let scrollY = 0;
const SCROLL_SPEED = 0.5;
const COPIES = 6;

function buildScrollItem(data){
  const el = document.createElement("div");
  el.className = "mini-letter show";
  const safe = t => (t||"").replace(/</g,"&lt;");
  if(data.photo){
    el.style.display = "flex";
    el.style.gap = "6px";
    el.style.alignItems = "stretch";
    el.innerHTML =
      '<div style="flex:1;min-width:0;">' +
        '<div class="mini-from">✉️ ' + safe(data.name||"익명") + '</div>' +
        '<div class="mini-emoji">' + (data.emojis||"") + '</div>' +
        '<div class="mini-text" style="-webkit-line-clamp:1;">' + safe(data.text||"") + '</div>' +
      '</div>' +
      '<img src="' + data.photo + '" style="width:55px;flex-shrink:0;border-radius:6px;object-fit:cover;display:block;">';
  } else {
    el.innerHTML =
      '<div class="mini-from">✉️ ' + safe(data.name||"익명") + '</div>' +
      '<div class="mini-emoji">' + (data.emojis||"") + '</div>' +
      '<div class="mini-text">' + safe(data.text||"") + '</div>';
  }
  return el;
}

function rebuildScroll(){
  scrollInner.innerHTML = "";
  scrollY = 0;
  scrollInner.style.transform = "translateY(0px)";
  if(todayLetters.length === 0) return;
  const panelH = document.getElementById("scroll-panel").clientHeight || 600;
  const estItemH = 90;
  const needed = Math.ceil((panelH * 3) / (todayLetters.length * estItemH));
  const copies = Math.max(COPIES, needed);
  for(let i = 0; i < copies; i++){
    todayLetters.forEach(d => scrollInner.appendChild(buildScrollItem(d)));
  }
}

function addScrollLetter(data){
  // 사진 있으면 sessionStorage에 캐시
  if(data.photo && data.key){
    sessionStorage.setItem('photo_' + data.key, data.photo);
  }
  // 캐시된 사진 복원 (Firebase에서 삭제된 경우)
  if(!data.photo && data.key){
    const cached = sessionStorage.getItem('photo_' + data.key);
    if(cached) data = {...data, photo: cached};
  }
  todayLetters.push(data);
  rebuildScroll();
}

function autoScroll(){
  if(todayLetters.length > 0){
    scrollY += SCROLL_SPEED;
    const totalH = scrollInner.scrollHeight;
    const halfH  = totalH / 2;
    if(scrollY >= halfH) scrollY -= halfH;
    scrollInner.style.transform = "translateY(-" + scrollY + "px)";
  }
  requestAnimationFrame(autoScroll);
}
autoScroll();

// ── 파티클 ──
function sparks(wrap,n,cols,type){
  for(let i=0;i<n;i++){
    const el=document.createElement("span");
    if(type==="s"){el.className="ss";el.textContent=["✦","✧","⋆","★","✨"][~~(Math.random()*5)];el.style.color=cols[~~(Math.random()*cols.length)];}
    else{el.className="sp";el.style.background=cols[~~(Math.random()*cols.length)];}
    const a=Math.random()*Math.PI*2, d=40+Math.random()*80;
    el.style.setProperty("--tx",Math.cos(a)*d+"px");
    el.style.setProperty("--ty",Math.sin(a)*d+"px");
    el.style.left=(40+Math.random()*40)+"%"; el.style.top=(20+Math.random()*50)+"%";
    el.style.animationDelay=(Math.random()*.3)+"s";
    el.style.animationDuration=(.6+Math.random()*.5)+"s";
    wrap.appendChild(el); setTimeout(()=>el.remove(),1500);
  }
}

// ── SVG ──
const wLsvg=()=>`<svg viewBox="0 0 80 70" width="72" height="62" xmlns="http://www.w3.org/2000/svg"><path d="M75 35 Q55 10 20 5 Q5 3 2 15 Q0 25 15 28 Q5 30 3 42 Q2 55 20 52 Q8 60 12 68 Q20 75 35 62 Q55 55 75 35Z" fill="#AFDBF2" opacity=".92"/><path d="M60 28Q45 18 25 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/><path d="M58 38Q42 30 22 30" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6"/></svg>`;
const wRsvg=()=>`<svg viewBox="0 0 80 70" width="72" height="62" xmlns="http://www.w3.org/2000/svg"><path d="M5 35 Q25 10 60 5 Q75 3 78 15 Q80 25 65 28 Q75 30 77 42 Q78 55 60 52 Q72 60 68 68 Q60 75 45 62 Q25 55 5 35Z" fill="#AFDBF2" opacity=".92"/><path d="M20 28Q35 18 55 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/><path d="M22 38Q38 30 58 30" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6"/></svg>`;
const envSVG=()=>`<svg viewBox="0 0 240 165" width="300" height="206" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="38" width="232" height="123" rx="12" fill="#E6F4FC" stroke="#5FA6D4" stroke-width="1.5"/><path d="M4 38L120 96L236 38Z" fill="#C4E6F7" stroke="#5FA6D4" stroke-width="1"/><path d="M4 161L86 105L120 122L154 105L236 161" fill="#D3ECF9" stroke="#5FA6D4" stroke-width="1"/><g transform="translate(108,52)"><path d="M12 4C12 4 6-2 2 2-2 6 4 12 12 18 20 12 26 6 22 2 18-2 12 4 12 4Z" fill="#E07050"/></g></svg>`;

// ── 슬롯 시스템 (고정 3열 × 2행 = 위 3개·아래 3개) ──
const slots=[];
const COLS=4, ROWS=2;      // 한 번에 보이는 편지 = 4×2 = 8개 (반듯한 정렬 격자)
const CARD_W=300, CARD_H=210;
const GAP_X=24, GAP_Y=38;  // 편지 사이 간격 (작을수록 서로 가깝게)
function getSlot(){
  const W=window.innerWidth, H=window.innerHeight;
  const gridW = COLS*CARD_W + (COLS-1)*GAP_X;        // 격자 전체 너비
  const startX = Math.max(235, Math.round((W - gridW)/2)); // 중앙 정렬(좌측 스크롤 패널 침범 방지)
  const topLimit = Math.max(300, Math.round(H*0.30));// 상: '믿음의 항해' 간판(위쪽 정렬) 아래
  const startY = topLimit + 8;                       // 타이틀 바로 아래부터
  const all=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x=startX + c*(CARD_W+GAP_X);
    const y=startY + r*(CARD_H+GAP_Y);
    if(!slots.some(s=>s.x===x&&s.y===y)) all.push({x,y});
  }
  if(!all.length) return null;
  return all[~~(Math.random()*all.length)];
}

// ── 큐 시스템 ──
const letterQueue = [];
let active = 0;
const MAX = 24;

function tryFlush(){
  while(active < MAX && letterQueue.length > 0){
    const slot = getSlot();
    if(!slot) break;
    animate(letterQueue.shift(), slot);
  }
  updateWait();
}

function animate(data, slot){
  active++;

  const hasPhoto = !!data.photo;

  const card=document.createElement("div"); card.className="lcard";
  const env=document.createElement("div");  env.className="lcard-env";
  const paper=document.createElement("div"); paper.className="lcard-paper";
  const sw=document.createElement("div");   sw.className="spark-wrap";
  const wl=document.createElement("div");   wl.className="wing-l";  wl.innerHTML=wLsvg();
  const wr=document.createElement("div");   wr.className="wing-r";  wr.innerHTML=wRsvg();
  const eb=document.createElement("div");   eb.innerHTML=envSVG();

  const safe=t=>(t||"").replace(/</g,"&lt;");

  if(hasPhoto){
    // 사진 있을 때: 편지지 + 사진 나란히
    paper.classList.add("has-photo");
    paper.innerHTML=`<div class="lp-lines"></div>
      <div class="lp-content">
        <div class="lp-from">✉️ ${safe(data.name||"익명")}님의 편지</div>
        <div class="lp-emojis">${data.emojis||""}</div>
        <div class="lp-text">${safe(data.text||"")}</div>
      </div>
      <div class="lp-photo">
        <img src="${data.photo}" alt="사진">
      </div>`;
  } else {
    // 사진 없을 때: 기존 레이아웃
    paper.innerHTML=`<div class="lp-lines"></div>
      <div class="lp-from">✉️ ${safe(data.name||"익명")}님의 편지</div>
      <div class="lp-emojis">${data.emojis||""}</div>
      <div class="lp-text">${safe(data.text||"")}</div>`;
  }

  env.append(wl,wr,eb);
  card.append(env, paper, sw);
  document.body.appendChild(card);

  slots.push(slot);

  const sx=window.innerWidth/2-150, sy=window.innerHeight+60;
  card.style.left=sx+"px"; card.style.top=sy+"px"; card.style.opacity="0";

  wl.classList.add("fl"); wr.classList.add("fl");

  // ① 비행
  let t0=null;
  (function fly(ts){
    if(!t0) t0=ts;
    const p=Math.min((ts-t0)/1800,1);
    const e=1-Math.pow(1-p,3);
    card.style.left=(sx+(slot.x-sx)*e)+"px";
    card.style.top=(sy+(slot.y-sy)*e - Math.sin(p*Math.PI)*120)+"px";
    card.style.opacity=Math.min(p*3,1);
    card.style.transform=`rotate(${Math.sin(p*Math.PI*4)*5}deg)`;
    if(p<1){requestAnimationFrame(fly);return;}
    card.style.transform=""; setTimeout(open,150);
  })(performance.now());

  // ② 열기 - 봉투 숨기고 편지지+사진 표시
  function open(){
    wl.classList.remove("fl"); wr.classList.remove("fl");
    wl.style.animation="none"; wr.style.animation="none";
    env.style.transition="opacity 0.35s"; env.style.opacity="0";
    sparks(sw,10,["#FFD700","#FFB6C1","#87CEEB"],"c");
    sparks(sw,8,["#FFD700","#FFC0CB","#FFFACD"],"s");
    paper.classList.add("show");

    // 📷 사진은 관리자가 admin.html에서 직접 삭제

    setTimeout(close,10000);
  }

  // ③ 닫기
  function close(){
    paper.classList.remove("show");
    setTimeout(()=>{
      env.style.opacity="1";
      wl.classList.add("fl"); wr.classList.add("fl");
      sparks(sw,10,["#FFD700","#fff","#FFE4B5"],"c");
      sparks(sw,8,["#FFD700","#FFC0CB"],"s");

      const i=slots.findIndex(s=>s.x===slot.x&&s.y===slot.y);
      if(i>-1) slots.splice(i,1);
      active--;
      tryFlush();

      const jx=window.innerWidth/2-150, jy=window.innerHeight*0.3-80;
      const cl=parseFloat(card.style.left), ct=parseFloat(card.style.top);
      let t1=null;
      (function fly2(ts){
        if(!t1) t1=ts;
        const p=Math.min((ts-t1)/1100,1);
        const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
        card.style.left=(cl+(jx-cl)*e)+"px";
        card.style.top=(ct+(jy-ct)*e)+"px";
        card.style.transform=`scale(${1-e*.85}) rotate(${e*360}deg)`;
        card.style.opacity=1-e*.9;
        if(p<1){requestAnimationFrame(fly2);return;}
        sparks(sw,14,["#FFD700","#fff","#FFFACD"],"s");
        setTimeout(()=>{card.remove();updateWait();},700);
      })(performance.now());
    },500);
  }
}

// ── 어드민 로그인 ──
window.adminLogin = function(){
  document.getElementById("admin-pw").value = "";
  document.getElementById("admin-pw-msg").textContent = "";
  document.getElementById("admin-pw").classList.remove("error");
  document.getElementById("admin-modal-bg").classList.add("show");
  setTimeout(()=>document.getElementById("admin-pw").focus(), 100);
};
window.closeAdminModal = function(){
  document.getElementById("admin-modal-bg").classList.remove("show");
};
window.clearPwErr = function(){
  document.getElementById("admin-pw-msg").textContent = "";
  document.getElementById("admin-pw").classList.remove("error");
};
window.checkPw = function(){
  const pw = document.getElementById("admin-pw").value;
  if(pw === "12345"){
    closeAdminModal();
    window.open("admin.html","_blank");
  } else {
    document.getElementById("admin-pw").classList.add("error");
    document.getElementById("admin-pw-msg").textContent = "비밀번호가 틀렸어요";
    document.getElementById("admin-pw").value = "";
    setTimeout(()=>document.getElementById("admin-pw").focus(), 50);
  }
};

function updateWait(){
  const wm = document.getElementById("waiting-msg");
  if(active===0 && letterQueue.length===0){
    wm.style.display="block";
    wm.textContent="🕊️ 편지를 기다리고 있어요...";
  } else if(letterQueue.length>0){
    wm.style.display="block";
    wm.textContent=`🕊️ 대기 중인 편지 ${letterQueue.length}개`;
  } else {
    wm.style.display="none";
  }
}

// ── Firebase 수신 ──
const startTime=Date.now();
const todayStart=new Date(); todayStart.setHours(0,0,0,0);
const dot=document.getElementById("dot");
try{
  dot.classList.add("on");
  onChildAdded(ref(db,"letters"),snap=>{
    const d=snap.val();
    if(!d||d.hidden) return;
    // 날짜 상관없이 모든 편지를 스크롤 패널/순환 목록에 추가
    addScrollLetter({...d, key: snap.key});
    if(d.timestamp > startTime){
      let ld = {...d, key: snap.key};
      // 사진 캐시 저장 및 복원 (용량 초과 등 에러가 나도 편지는 반드시 대기열에 넣음)
      try{
        if(ld.photo) sessionStorage.setItem('photo_' + ld.key, ld.photo);
        else if(sessionStorage.getItem('photo_' + ld.key)){
          ld.photo = sessionStorage.getItem('photo_' + ld.key);
        }
      }catch(err){ console.warn('사진 캐시 저장 실패(편지는 정상 표시):', err); }
      letterQueue.push(ld);
      tryFlush();
    }
  });
}catch(e){dot.style.background="#f87171";console.error(e);}

updateWait();

// ── 기존 편지 자동 순환 ──
const usedKeys = new Set();
function replayLoop(){
  setTimeout(()=>{
    // 새 편지 대기중이거나 화면이 꽉 차면 스킵
    if(letterQueue.length === 0 && active < MAX && todayLetters.length > 0){
      // 날짜 상관없이 모든 편지를 무한 순환 (아직 안 보여준 것 먼저, 다 보여줬으면 초기화)
      let pool = todayLetters.filter(d => !usedKeys.has(d.key || d.timestamp));
      if(pool.length === 0){
        usedKeys.clear();
        pool = [...todayLetters];
      }
      const pick = pool[~~(Math.random() * pool.length)];
      const slot = getSlot();
      if(pick && slot){
        usedKeys.add(pick.key || pick.timestamp);
        animate(pick, slot);
      }
    }
    replayLoop();
  }, 3000);
}
replayLoop();
</script>
